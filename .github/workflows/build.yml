name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=android --org com.vfree --project-name vfree .
      - name: Patch android
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release 2>&1 | tee build.log
      - name: Log kaydet (hata halinde debug branchine)
        if: failure()
        run: |
          tail -n 400 build.log > /tmp/last.log || true
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git checkout -B debug
          mv /tmp/last.log build.log
          git add build.log
          git commit -m "build log"
          git push -f origin debug
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: vfree-apk, path: build/app/outputs/flutter-apk/app-release.apk}
      - uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: vfree v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
